<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock 1 — Phone as stage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible+Next:wght@400;600&display=swap">
<link rel="stylesheet" href="mock.css">
<style>
 .stage{min-height:100%;display:grid;grid-template-columns:minmax(220px,300px) auto minmax(260px,1fr);gap:36px;padding:32px 40px;align-items:start}
 h1{font:700 30px/1.05 var(--display);margin-bottom:6px}
 .sub{color:var(--muted);margin-bottom:22px;max-width:30ch}
 .cast{display:flex;flex-direction:column;gap:14px}
 .card{display:flex;gap:12px;align-items:flex-start}
 .card b{font:600 14px/1.2 var(--display)}
 .card p{color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
 .card em{font-style:normal;color:color-mix(in oklch,var(--c) 80%,white)}
 .col{display:flex;flex-direction:column;gap:14px;align-items:center}
 .side{display:flex;flex-direction:column;gap:18px;align-items:flex-start;min-height:200px}
 .mini{width:300px;border-radius:22px;background:#10141f;padding:6px;box-shadow:0 0 0 1px var(--line),0 18px 40px #0006;animation:peel .5s cubic-bezier(.2,.9,.2,1) both}
 @keyframes peel{from{transform:translateX(-60px) rotate(-6deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
 .mini .screen{border-radius:17px;height:210px}
 .mini .bar{padding:9px 12px 7px}.mini .bar h2{font-size:13px}
 .mini .feed{padding:8px;gap:4px;font-size:12.5px}.mini .bub{padding:5px 8px;font-size:12.5px}
 .mini .av{--s:22px}
 .note{color:var(--muted);font-size:12.5px;max-width:34ch}
 .dashed{outline:1px dashed var(--muted);outline-offset:3px;display:inline-block;padding:0 3px;border-radius:4px}
 @media (max-width:1100px){.stage{grid-template-columns:1fr;justify-items:center}}
</style></head><body>
<main class="stage">
 <section aria-label="Cast">
  <h1 id="t"></h1><p class="sub">A building group chat after midnight, watched as a phone.</p>
  <div class="cast" id="cast"></div>
 </section>
 <section class="col">
  <div class="phone"><div class="screen">
   <div class="bar"><div class="av" style="--c:oklch(.78 .13 200);--s:34px">B</div><div><h2 id="room"></h2><small id="who"></small></div></div>
   <div class="feed" id="feed" role="log" aria-live="polite"></div>
  </div></div>
  <div class="transport" id="tr" style="width:420px"></div>
  <p class="cap" id="cap"></p>
 </section>
 <section class="side" id="side" aria-label="Private side-chats"></section>
</main>
<script src="data/cat-run.js"></script><script src="common.js"></script>
<script>
const {R,A,meta,chLabel,beats,Player,Babble,avatar,esc,transport}=M;
document.getElementById('t').textContent=R.title;
const pub=R.channels.find(c=>c.type==='public_channel');
document.getElementById('room').textContent=pub.name;
document.getElementById('who').textContent=pub.members.map(i=>A[i].short).join(', ');
document.getElementById('cast').innerHTML=R.agents.map(a=>`<div class="card" style="--c:${a.color}">${avatar(a.id,40)}<div><b>${a.name}</b><p><em>${a.archetype}</em> · ${esc(a.style)}</p><p>writes ~${a.avgChars} chars a message, types ${a.msPerChar} ms a letter</p></div></div>`).join('');
const feed=document.getElementById('feed'),side=document.getElementById('side'),cap=document.getElementById('cap');
const mini=new Map(),open=[];let typingEl=null,byId={},pending=null;
function stamp(f){if(pending&&f.dataset.clock!==pending){f.append(clockChip(pending));f.dataset.clock=pending}}
function bubble(e,inst){
  const a=A[e.actor],row=document.createElement('div');row.className='row';row.style.setProperty('--c',a.color);if(inst)row.style.animation='none';
  const to=e.to.length?`<span class="k" style="color:var(--muted)"> to ${e.to.map(i=>A[i].short).join(', ')}${e.inferred?'<span class="dashed" title="inferred from mentions and turn order, not recorded">?</span>':''}</span>`:'';
  row.innerHTML=`${avatar(e.actor,28)}<div class="bub ${e.inferred&&e.to.length?'inf':''}"><b>${a.short}${to}</b>${esc(e.text)}</div>`;
  byId[e.id]=row.querySelector('.bub');return row;
}
function clockChip(c){const d=document.createElement('div');d.className='clock';d.textContent=c;return d}
function miniFor(chId){
  if(mini.has(chId))return mini.get(chId);
  const el=document.createElement('div');el.className='mini';
  el.innerHTML=`<div class="screen"><div class="bar"><div><h2>${chLabel(chId)}</h2><small>private · peeled off the building chat</small></div></div><div class="feed"></div></div>`;
  side.prepend(el);mini.set(chId,el);open.unshift(chId);
  while(open.length>3){const x=open.pop();mini.get(x).remove();mini.delete(x)}
  return el;
}
const bs=beats();
const pl=new Player(bs,{
 onReset(){pending=null;delete feed.dataset.clock;feed.innerHTML='';side.innerHTML='';mini.clear();open.length=0;byId={};cap.textContent=''},
 onTyping(b,ms){const a=A[b.e.actor];if(b.e.ch!==pub.id)return;typingEl=document.createElement('div');typingEl.className='row';typingEl.style.setProperty('--c',a.color);typingEl.innerHTML=`${avatar(b.e.actor,28)}<div class="typing"><i></i><i></i><i></i></div>`;feed.append(typingEl);feed.scrollTop=1e9},
 onTypingEnd(){typingEl&&typingEl.remove();typingEl=null},
 onBeat(b,o){
  const inst=o.instant;
  if(b.t==='clock'){pending=b.clock;return}
  const e=b.e,isPub=e.ch===pub.id;
  if(b.t==='say'){
   const row=bubble(e,inst);
   if(isPub){stamp(feed);feed.append(row);feed.scrollTop=1e9}
   else{const m=miniFor(e.ch).querySelector('.feed');stamp(m);m.append(row);m.scrollTop=1e9}
   if(!inst){Babble.say(e.actor,e.text);cap.textContent=`${A[e.actor].short} → ${e.to.length?e.to.map(i=>A[i].short).join(', '):'the room'}`}
  }else if(b.t==='react'&&byId[e.target]){const t=document.createElement('span');t.className='tap';t.textContent=e.emoji;byId[e.target].append(t)}
  else if(b.t==='open'){const d=document.createElement('div');d.className='sys';d.textContent=`${A[e.actor].short} opened a side-chat`;feed.append(d)}
 }
});
const upd=transport(document.getElementById('tr'),pl);pl.h.onState=upd;upd(pl);
</script></body></html>
