<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock 5 — Share frames</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible+Next:wght@400;600&display=swap">
<link rel="stylesheet" href="mock.css">
<style>
 .wrap{padding:32px 40px;max-width:1300px;margin:auto}
 h1{font:700 30px/1.05 var(--display);margin-bottom:6px}.sub{color:var(--muted);margin-bottom:18px;max-width:62ch}
 .lens{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;width:max-content;margin-bottom:24px}
 .lens button{padding:9px 14px;font:600 13px/1 var(--display);color:var(--muted)}
 .lens button[aria-pressed=true]{background:var(--paper);color:var(--ink)}
 .frames{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
 .f{width:360px;height:640px;border-radius:22px;overflow:hidden;position:relative;background:var(--ground);box-shadow:0 0 0 1px var(--line),0 24px 60px #0007;display:flex;flex-direction:column;padding:34px 26px}
 .cap{color:var(--muted);font-size:12.5px;margin-top:10px;max-width:360px}
 /* cold open */
 .big{font:800 58px/.92 var(--display);letter-spacing:-.02em;margin:18px 0 14px}
 .time{font:700 18px/1 var(--display);color:var(--sodium)}
 .hook{font-size:17px;line-height:1.35;max-width:24ch}
 .castl{margin-top:auto;display:flex;flex-direction:column;gap:12px}
 .castl .r{display:flex;gap:10px;align-items:center}
 .castl b{font:600 15px/1.1 var(--display)}.castl small{display:block;color:var(--muted);font-size:12px}
 .glow{position:absolute;right:-90px;top:90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,#e8a33d55,transparent 65%);pointer-events:none}
 /* mid shot */
 .mid{padding:0}
 .mid .bar{padding:26px 18px 12px}
 .mid .feed{padding:12px;gap:8px;justify-content:flex-end}
 .quote{font:700 19px/1.15 var(--display);color:var(--paper)}
 .fic .thought{display:none}
 .thought{margin:-8px 0 0 20px;padding:14px 10px 8px;border-radius:0 0 12px 12px;background:color-mix(in oklch,var(--c) 22%,#121827);border:1px solid color-mix(in oklch,var(--c) 45%,transparent);border-top:0;font-size:12px;line-height:1.35;color:#dfe3f1}
 .pairf{display:flex;flex-direction:column;max-width:88%}
 .pairf .bub{z-index:2;max-width:100%}
 /* end card */
 .led{display:flex;flex-direction:column;gap:14px;margin-top:20px}
 .led .l{display:flex;align-items:center;gap:10px;font-size:14px}
 .led .l .bar2{height:6px;border-radius:3px;background:var(--line);flex:1;position:relative;overflow:hidden}
 .led .l .bar2 i{position:absolute;top:0;bottom:0;border-radius:3px}
 .num{font:800 44px/1 var(--display)}
 .row3{display:flex;gap:22px;margin-top:auto}.row3 span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
</style></head><body>
<main class="wrap">
 <h1>Share frames</h1>
 <p class="sub">What the exported vertical cut opens with, lands on, and ends on. Every figure on these cards is computed from the run, nothing is hand-written except the one-line hook taken from the scene brief.</p>
 <div class="lens" role="group" aria-label="Export lens"><button id="omni" aria-pressed="true">Omniscient cut</button><button id="fic" aria-pressed="false">Fiction-only cut</button></div>
 <div class="frames" id="frames"></div>
</main>
<script src="data/cat-run.js"></script><script src="common.js"></script>
<script>
const {R,A,esc,avatar}=M,P=R.pulses,last=P[P.length-1],first=P[0];
const total=M.msgs.length,priv=M.msgs.filter(m=>M.meta[m.ch].type!=='public_channel').length;
// pick the pull-quote: the longest Tavo line that contains "byline" if present, else the sharpest short line
const q=M.msgs.find(m=>/byline/i.test(m.text))||M.msgs[0];
const qtxt=q.text.split(/[.\n]/)[0].replace(/^[^a-zA-Z]+/,'').replace(/[,;:\s]+$/,'');
const think=P[q.p].think[q.actor];
// ledger: pair moves between first and last pulse
const rows=[];R.agents.forEach(a=>R.agents.forEach(b=>{if(a===b)return;const f=first.rel[a.id]?.[b.id],l=last.rel[a.id]?.[b.id];if(f&&l)rows.push({a,b,s:l.suspicion-f.suspicion,t:l.trust-f.trust})}));
const susp=[...rows].sort((x,y)=>y.s-x.s).filter(r=>r.s>.05).slice(0,3),trust=[...rows].sort((x,y)=>y.t-x.t)[0];
const silences=R.agents.map(a=>{let best=0,run=0;const sp=new Set(M.msgs.filter(m=>m.actor===a.id).map(m=>m.p));for(let p=0;p<P.length;p++){run=sp.has(p)?0:run+1;best=Math.max(best,run)}return{a,best}}).sort((x,y)=>y.best-x.best)[0];
const bar=(v,color)=>`<span class="bar2"><i style="left:${v>=0?50:50+v*100}%;width:${Math.abs(v)*100}%;background:${color}"></i></span>`;
document.getElementById('frames').innerHTML=`
<figure><div class="f"><div class="glow"></div>
 <span class="time">${first.clock}</span>
 <div class="big">${esc(R.title)}</div>
 <p class="hook">Assembly is at 7. Everyone has one thing they cannot say in the building chat.</p>
 <div class="castl">${R.agents.map(a=>`<div class="r" style="--c:${a.color}">${avatar(a.id,38)}<div><b>${a.name}</b><small>${a.archetype} · writes ~${a.avgChars} characters at a go</small></div></div>`).join('')}</div></div>
 <figcaption class="cap">Cold open, 2 s. Story clock in sodium, title in the display face, cast with generated signatures.</figcaption></figure>

<figure><div class="f mid" id="mid"><div class="bar"><span class="time">${P[q.p].clock}</span></div>
 <div class="feed" style="--c:${A[q.actor].color}">
  <div class="quote" style="padding:0 6px 14px">“${esc(qtxt)}…”</div>
  <div class="row" style="--c:${A[q.actor].color}">${avatar(q.actor,30)}<div class="pairf"><div class="bub"><b>${A[q.actor].short} · ${M.chLabel(q.ch)}</b>${esc(q.text.length>150?q.text.slice(0,147)+'…':q.text)}</div>${think?`<div class="thought"><span class="k">${A[q.actor].short} is thinking</span><br>${esc(think.motive.length>130?think.motive.slice(0,127)+'…':think.motive)}</div>`:''}</div></div>
 </div></div>
 <figcaption class="cap">Mid shot at the line a viewer would quote. The thought layer is dropped in the fiction-only cut.</figcaption></figure>

<figure><div class="f"><span class="time">${last.clock}</span>
 <div class="big" style="font-size:40px">Where they ended up</div>
 <div class="led">
  ${susp.map(r=>`<div class="l"><b style="color:${r.a.color};width:64px">${r.a.short}</b>${bar(r.s*2.2,'oklch(.78 .16 25)')}<span>${r.s>=0?'+':''}${r.s.toFixed(2)} suspicion of <b style="color:${r.b.color}">${r.b.short}</b></span></div>`).join('')}
  <div class="l"><b style="color:${trust.a.color};width:64px">${trust.a.short}</b>${bar(trust.t*2.2,'oklch(.8 .13 190)')}<span>${trust.t>=0?'+':''}${trust.t.toFixed(2)} trust in <b style="color:${trust.b.color}">${trust.b.short}</b></span></div>
 </div>
 <div class="row3"><div><div class="num">${total}</div><span>messages</span></div><div><div class="num">${Math.round(priv/total*100)}%</div><span>said in side-chats</span></div><div><div class="num">${silences.best}</div><span>pulses ${silences.a.short} stayed quiet</span></div></div></div>
 <figcaption class="cap">End card. Ledger is last pulse minus first pulse, from the recorded relational states.</figcaption></figure>`;
const omni=document.getElementById('omni'),fic=document.getElementById('fic');
function lens(o){document.getElementById('frames').classList.toggle('fic',!o);omni.setAttribute('aria-pressed',o);fic.setAttribute('aria-pressed',!o)}
omni.onclick=()=>lens(true);fic.onclick=()=>lens(false);
</script></body></html>
