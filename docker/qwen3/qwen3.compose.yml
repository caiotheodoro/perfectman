name: perfectman

services:
  qwen3:
    image: ollama/ollama:latest
    container_name: perfectman-qwen3
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - qwen3-ollama-data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        server_pid=$$!
        until ollama list >/dev/null 2>&1; do
          sleep 1
        done
        ollama pull "$${OLLAMA_MODEL:-qwen3:1.7b}"
        wait "$$server_pid"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ollama list | grep -q \"$${OLLAMA_MODEL:-qwen3:1.7b}\""
        ]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  qwen3-ollama-data:
