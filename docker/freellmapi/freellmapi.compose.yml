name: perfectman

services:
  freellmapi:
    build:
      context: ../..
      dockerfile: docker/freellmapi/freellmapi.Dockerfile
      args:
        FREELLMAPI_REF: ${FREELLMAPI_REF:-main}
    container_name: perfectman-freellmapi
    environment:
      ENCRYPTION_KEY: ${FREELLMAPI_ENCRYPTION_KEY:?Set FREELLMAPI_ENCRYPTION_KEY in .env}
      PORT: "3001"
    ports:
      - "3001:3001"
      - "5173:5173"
    volumes:
      - freellmapi-data:/opt/freellmapi/server/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/v1/models').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

volumes:
  freellmapi-data:
