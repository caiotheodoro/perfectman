name: PR gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORE_SCENARIOS: v1_casual_chat,v1_exclusion_inferred,v1_private_motive,motive_gossip,edge_public_mock,edge_exclusion_cascade,edge_gossip_catalyst,edge_mutation_pressure,stagnation_resentment_loop,calibration_quiet_room,motive_flirting
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages resolve each other through dist/ — a stale build
      # produces phantom typecheck/test failures (seen locally), so build
      # everything before running the gates.
      - name: Build packages
        run: pnpm -r build

      - name: Typecheck (lint)
        run: pnpm lint

      - name: Unit + hygiene tests
        run: pnpm test:all

      # Behavior tests: every run uses the mock provider, so no model and no
      # API key. Signals must hold at 100%, and the drama scenarios ride on
      # the same report and gate.
      # NOTE: pnpm --filter runs inside packages/eval, so --out gets an
      # absolute workspace path to keep the later steps root-relative.
      - name: Behavior tests (core slice)
        run: pnpm --filter @perfectman/eval behavior --slice core --drama --out "$GITHUB_WORKSPACE/out/behavior-pr-gate.json"

      - name: Assert behavior gate
        run: node scripts/ci/check-bench-gate.mjs --require-drama out/behavior-pr-gate.json "$CORE_SCENARIOS"

      - name: Upload behavior report
        if: always() && hashFiles('out/behavior-pr-gate.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: behavior-pr-gate
          path: out/behavior-pr-gate.json
