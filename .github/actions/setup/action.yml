name: "Perfectman CI setup"
description: "Checkout, pnpm+node, frozen install, workspace build. Shared by PR gate and benchmark workflows so they cannot drift."

inputs:
  node-version:
    description: "Node major to install"
    required: false
    default: "22"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4
      with:
        version: 10

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Workspace packages resolve each other through dist/ — build before gates.
    - name: Build packages
      shell: bash
      run: pnpm -r build
